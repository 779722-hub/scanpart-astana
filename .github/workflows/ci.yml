name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: npm ci
        run: npm ci --no-audit --no-fund

  lint:
    name: ESLint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings 0

  typecheck:
    name: TypeScript
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build:
    name: Next.js build
    needs: [lint, typecheck, secrets-scan]
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders so `next build` doesn't crash on missing envs.
      # Real values are injected at runtime on the VPS.
      NEXT_TELEMETRY_DISABLED: "1"
      PHAETON_BASE_URL: "https://api.phaeton.kz"
      PHAETON_USER_GUID: "ci-placeholder"
      PHAETON_API_KEY: "ci-placeholder"
      IRON_SESSION_PASSWORD: "ci-placeholder-padding-32-characters-long"
      BCRYPT_PEPPER: "ci-placeholder"
      NEXT_PUBLIC_SITE_NAME: "SCANPART.ASTANA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
